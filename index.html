<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>product card</title>
  <link rel="stylesheet", href="style.css">
</head>
<body>
  <main class="main">
    <div class="container">
      <h1 class="title">Выбери свой продукт</h1>

      <ul class="products">
        <li class="products_item card">
          <img src="img/moisturizing_mousse.jpg" alt="" class="card_image">
          <span class="card_category"></span>
          <h2 class="card_name"></h2>
          <p></p>
        </li>
      </ul>
    </div>
  </main>
</body>
</html>

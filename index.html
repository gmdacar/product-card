<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>product card</title>
  <link rel="stylesheet", href="style.css">
</head>
<body>
  <main class="main">
    <div class="container">
      <h1 class="title">Выбери свой продукт</h1>

      <ul class="products">
        <li class="products_item card">
          <img src="img/moisturizing_mousse.jpg" alt="" class="card_image">
          <span class="card_category">для нормальной кожи</span>
          <h2 class="card_name">Увлажняющий мусс</h2>
          <p class="card_description">Глубоко увлажняют кожу лица, оставляя её мягкой и гладкой.</p>

          <div class="card_compound compound">
            <span class="compound_name">Состав:</span>
            <ul class="compound_list">
              <li>активные натуральные комплексы</li>
              <li>витамины С, А, РР, В И Е</li>
              <li>солнцезащитные компоненты</li>
            </ul>
          </div>
        </li>
      </ul>
    </div>
  </main>
</body>
</html>
